<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listing — Alfa Team Invest</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<div id="listing-content"></div>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/lang.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/chrome.js"></script>
<script src="js/listings.js"></script>
<script>
async function loadListing(){
  const id = new URLSearchParams(location.search).get('id');
  const container = document.getElementById('listing-content');
  if (!id){ container.innerHTML = '<p class="wrap" style="padding:60px 24px;">Not found.</p>'; return; }
  const { data: l, error } = await supabaseClient.from('listings').select('*').eq('id', id).single();
  if (error || !l){ container.innerHTML = '<p class="wrap" style="padding:60px 24px;">Listing not found.</p>'; return; }

  const lang = getLang();
  const title = lang === 'ro' ? l.title_ro : l.title_en;
  const desc = lang === 'ro' ? l.description_ro : l.description_en;
  const images = (l.images && l.images.length) ? l.images : [l.cover_image || 'https://placehold.co/1200x800/1D2227/EAEAE4?text=ALFA+TEAM'];

  container.innerHTML = `
    <div class="detail-hero">
      <div class="wrap">
        <div class="mono" style="color:#C68E17;font-size:0.8rem;">${t('ref')} ${l.ref_code || '—'}</div>
        <h1 style="color:white;margin-top:8px;font-size:2.2rem;">${title}</h1>
      </div>
    </div>
    <div class="detail-gallery">
      <img src="${images[0]}" alt="${title}">
      <div style="display:grid;grid-template-rows:${images.length>2?'1fr 1fr':'1fr'};gap:2px;">
        ${images.slice(1,3).map(i=>`<img src="${i}" alt="${title}">`).join('') || ''}
      </div>
    </div>
    <div class="wrap" style="padding:48px 24px;display:grid;grid-template-columns:2fr 1fr;gap:48px;">
      <div>
        <h2 style="margin-bottom:16px;">Overview</h2>
        <p style="color:var(--graphite-soft);">${desc || ''}</p>
      </div>
      <div>
        <table class="spec-table">
          <tr><td>${t('location_label')}</td><td>${l.city || ''}${l.city && l.country ? ', ' : ''}${l.country || ''}</td></tr>
          <tr><td>${t('size_label')}</td><td>${l.size_sqm ? l.size_sqm.toLocaleString()+' m²' : '—'}</td></tr>
          <tr><td>Category</td><td>${l.category || '—'}</td></tr>
          <tr><td>Price</td><td>${formatPrice(l)}</td></tr>
        </table>
        <a href="contact.html" class="btn btn-primary" style="margin-top:24px;width:100%;text-align:center;">${t('hero_cta2')}</a>
      </div>
    </div>`;
}
document.addEventListener('DOMContentLoaded', loadListing);
</script>
</body>
</html>
