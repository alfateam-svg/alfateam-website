<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Alfa Team Invest</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<section style="padding-top:64px;">
  <div class="wrap" style="max-width:560px;">
    <h1 style="font-size:2.2rem;margin-bottom:12px;" data-i18n="contact_title"></h1>
    <p style="color:var(--graphite-soft);margin-bottom:32px;" data-i18n="contact_lead"></p>
    <form id="contact-form">
      <div class="field">
        <label data-i18n="form_name"></label>
        <input type="text" name="name" required>
      </div>
      <div class="field">
        <label data-i18n="form_email"></label>
        <input type="email" name="email" required>
      </div>
      <div class="field">
        <label data-i18n="form_message"></label>
        <textarea name="message" rows="5" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary" data-i18n="form_send"></button>
      <p id="form-status" class="mono" style="margin-top:14px;font-size:0.85rem;"></p>
    </form>
  </div>
</section>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/lang.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/chrome.js"></script>
<script>
document.getElementById('contact-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const fd = new FormData(e.target);
  const status = document.getElementById('form-status');
  status.textContent = '...';
  // Requires an "inquiries" table (see supabase-schema.sql) — or swap for mailto/Formspree if preferred
  const { error } = await supabaseClient.from('inquiries').insert({
    name: fd.get('name'), email: fd.get('email'), message: fd.get('message')
  });
  status.textContent = error ? 'Something went wrong — please email us directly.' : 'Message sent — we will be in touch shortly.';
  if (!error) e.target.reset();
});
</script>
</body>
</html>
