<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alfa Team Invest — Commercial & Industrial Real Estate</title>
<meta name="description" content="Alfa Team Invest sources and structures commercial and industrial property acquisitions worldwide.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<header style="display:none"></header>

<section class="hero">
  <div class="coord-field">
    <div class="coord-dot" style="top:25%;left:20%" data-label="47.05N, 21.92E · Oradea"></div>
  </div>
  <div class="wrap">
    <div class="hero-eyebrow" data-i18n="hero_eyebrow"></div>
    <h1 data-i18n="hero_title"></h1>
    <p class="lead" data-i18n="hero_lead"></p>
    <div style="margin-top:36px;display:flex;gap:14px;flex-wrap:wrap;">
      <a href="listings.html" class="btn btn-primary" data-i18n="hero_cta"></a>
      <a href="contact.html" class="btn" style="border-color:#3A4048;color:#EAEAE4;" data-i18n="hero_cta2"></a>
    </div>
    <div class="hero-stats">
      <div class="stat"><div class="num" id="stat-1">—</div><div class="label" data-i18n="stat_1_label"></div></div>
      <div class="stat"><div class="num">8</div><div class="label" data-i18n="stat_2_label"></div></div>
      <div class="stat"><div class="num">210K+</div><div class="label" data-i18n="stat_3_label"></div></div>
    </div>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="section-head">
      <div>
        <div class="eyebrow" data-i18n="section_featured_eyebrow"></div>
        <h2 data-i18n="section_featured_title"></h2>
      </div>
      <a href="listings.html" class="mono" style="font-size:0.85rem;" data-i18n="view_all"></a>
    </div>
    <div class="listing-grid" id="featured-grid"></div>
  </div>
</section>

<div id="site-footer"></div>
<footer style="display:none"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/lang.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/chrome.js"></script>
<script src="js/listings.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async ()=>{
  await renderFeatured();
  const { count } = await supabaseClient.from('listings').select('*', { count:'exact', head:true }).eq('status','active');
  if (count !== null) document.getElementById('stat-1').textContent = count;
});
</script>
</body>
</html>
